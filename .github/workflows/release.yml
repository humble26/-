# GitHub Actions 自动发版（可选）
# 说明：本工作流在推送 v* 标签时自动构建 zip 并发布到 Releases。
# 由于 PyInstaller 打包需 Windows 环境，此工作流使用 windows-latest runner。
# 用法：git tag v2.4.4 && git push origin v2.4.4
# 注意：仓库需在 Settings -> Actions 中启用工作流；secrets 无需额外配置。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller pypinyin

      - name: 生成数据与资源版本
        run: |
          python tools/enrich_data.py
          python tools/sync_assets.py

      - name: 运行测试
        run: |
          node --version
          python -m PyInstaller --version

      - name: 打包单文件 exe
        run: |
          python -m PyInstaller --noconsole --onefile --name Jiaowodao launcher.py

      - name: 组装 zip
        shell: pwsh
        run: |
          $stage = '_zip_stage'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse -Force 'sjtu-link' "$stage\sjtu-link"
          Copy-Item -Force 'install-jiaowodao.ps1','安装交我导.cmd','安装指南.md','安装指南.txt','CHANGELOG.md' $stage
          Copy-Item -Force 'dist\Jiaowodao.exe' "$stage\sjtu-link\Jiaowodao.exe"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, '交我导-桌面版安装包.zip', [System.IO.Compression.CompressionLevel]::Optimal, $false, [System.Text.Encoding]::UTF8)

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: 交我导-桌面版安装包.zip
          generate_release_notes: true
